# Zet recepten uit het formulier "Recept toevoegen" (Firestore `eigen`) als bestanden in de repo.
name: Eigen recepten naar de repo
on:
  schedule:
    - cron: "7,37 * * * *"   # elk halfuur
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: eigen-recepten
jobs:
  importeer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nieuwe recepten ophalen
        run: python3 scripts/eigen_naar_repo.py
      - name: Bewaren in de repo
        run: |
          git add _recepten assets/eigen
          if git diff --cached --quiet; then echo "Niets nieuw"; exit 0; fi
          git config user.name "Recept toevoegen"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Eigen recepten uit het formulier toegevoegd"
          git push
