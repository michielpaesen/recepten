<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>window.FIREBASE_CONFIG = {{ site.firebase | jsonify }};</script>
  <script src="{{ '/assets/db.js' | relative_url }}"></script>
  <script src="{{ '/assets/lijst.js' | relative_url }}"></script>
  <script src="{{ '/assets/week.js' | relative_url }}"></script>
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="site-title">🍳 {{ site.title }}</a>
    <nav class="nav">
      <a href="{{ '/in-huis/' | relative_url }}" class="nav-link">🥕 In huis</a>
      <a href="{{ '/weekmenu/' | relative_url }}" class="nav-link">📅 Weekmenu</a>
      <a href="{{ '/boodschappen/' | relative_url }}" class="nav-link">🛒 Boodschappen</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
